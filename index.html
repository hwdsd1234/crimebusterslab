<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Crime Busters Virtual Lab</title>
<link rel="stylesheet" href="css/base.css?v=20261030c"/>
<link rel="stylesheet" href="css/bench.css?v=20261030c"/>
<link rel="stylesheet" href="css/apparatus.css?v=20261030c"/>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <strong data-i18n="Crime Busters">Crime Busters</strong>
    <span data-i18n="Virtual Lab · Division B">Virtual Lab · Division B</span>
  </div>

  <nav class="modes">
    <button data-mode="case" data-i18n="New case">New case</button>
    <button data-mode="drill" data-i18n="Drill">Drill</button>
    <button data-mode="sandbox" data-i18n="Sandbox">Sandbox</button>
    <button data-mode="chem" data-i18n="Chem Lab">Chem Lab</button>
  </nav>

  <div class="topbar-tools">
    <div class="lang-switch" id="langSwitch">
      <button data-lang="en">EN</button>
      <button data-lang="both">EN+中文</button>
      <button data-lang="zh">中文</button>
    </div>
    <div class="lang-switch" id="difficulty" title="Difficulty">
      <button data-difficulty="easy" data-i18n="Easy">Easy</button>
      <button data-difficulty="normal" data-i18n="Normal">Normal</button>
      <button data-difficulty="hard" data-i18n="Hard">Hard</button>
    </div>
    <input id="seedInput" type="number" inputmode="numeric" data-i18n-placeholder="seed" placeholder="seed"/>
    <button id="seedCase" class="btn small" data-i18n="Load seed">Load seed</button>
    <button id="resetMode" class="btn small" data-i18n="Reset">Reset</button>
    <button id="newCase" class="btn small" data-i18n="Random case">Random case</button>
    <div class="score-chip" id="scoreChip">—</div>
  </div>
</header>

<main class="layout">
  <aside class="shelf" id="shelf" aria-label="Equipment"></aside>

  <div class="center">
    <section class="stage" id="stage"></section>
    <section class="panel report" id="questions"></section>
    <section class="panel" id="technique"></section>
  </div>

  <aside class="casefile" id="casefile" aria-label="Case file"></aside>
</main>

<footer class="rulebar" data-i18n="Equipment set is the 2026 Division B Chemistry Lab Equipment List. Microscope, heat source, and balance are shown as event-provided — confirm against the current Rules Manual before treating them as team-supplied.">Equipment set is the 2026 Division B Chemistry Lab Equipment List. Microscope, heat source, and balance are shown as event-provided — confirm against the current Rules Manual before treating them as team-supplied.</footer>

<!-- Plain scripts sharing one window.LAB namespace, so the page runs straight off
     the filesystem with no server. Order matters: each file reads what earlier
     files put on LAB. -->
<!-- Every script and stylesheet carries ?v=: bump it on each release so browsers
     drop their cached copies (GitHub Pages lets them keep files for ten minutes). -->
<script>window.LAB = {};</script>
<script src="js/i18n/zh-ui.js?v=20261030c"></script>
<script src="js/i18n/zh-devices.js?v=20261030c"></script>
<script src="js/i18n/zh-samples.js?v=20261030c"></script>
<script src="js/i18n/zh-bio.js?v=20261030c"></script>
<script src="js/i18n/zh-case.js?v=20261030c"></script>
<script src="js/i18n/zh-sim.js?v=20261030c"></script>
<script src="js/i18n.js?v=20261030c"></script>
<script src="js/data/samples.js?v=20261030c"></script>
<script src="js/data/biology.js?v=20261030c"></script>
<script src="js/data/materials.js?v=20261030c"></script>
<script src="js/data/inks.js?v=20261030c"></script>
<script src="js/data/case-text.js?v=20261030c"></script>
<script src="js/engine/devices.js?v=20261030c"></script>
<script src="js/engine/svg.js?v=20261030c"></script>
<script src="js/engine/model.js?v=20261030c"></script>
<script src="js/engine/state.js?v=20261030c"></script>
<script src="js/engine/scoring.js?v=20261030c"></script>
<script src="js/engine/generator.js?v=20261030c"></script>
<script src="js/ui/stations.js?v=20261030c"></script>
<script src="js/ui/shelf.js?v=20261030c"></script>
<script src="js/ui/panels.js?v=20261030c"></script>
<script src="js/ui/casefile.js?v=20261030c"></script>
<script src="js/ui/chemlab.js?v=20261030c"></script>
<script src="js/main.js?v=20261030c"></script>
</body>
</html>
